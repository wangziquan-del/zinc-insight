name: Deploy Zinc Insight

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook readers
        run: pip install openpyxl xlrd
      - name: Refresh Zhiji live data
        env:
          ZHIJI_API_KEY: ${{ secrets.ZHIJI_API_KEY }}
        run: python scripts/refresh_live_data.py
      - name: Validate dashboard
        run: node scripts/check_site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4